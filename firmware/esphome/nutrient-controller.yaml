esphome:
  name: nutrient-controller
esp32:
  board: esp32dev
  framework:
    type: arduino
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Nutrient Controller"
    password: !secret ap_password
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: growroom/nutrient
  discovery: true
ota:
  - platform: esphome
    password: !secret ota_password
logger:
  level: DEBUG
interval:
  - interval: 60s
    then:
      - if:
          condition:
            not:
              mqtt.connected:
          then:
            - logger.log: "MQTT disconnected — check broker"
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  frequency: 50kHz
ads1115:
  - address: 0x48
sensor:
  # ---------- pH SENSOR (offset +0.34 applied) ----------
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 4.096
    name: "pH Voltage"
    id: ph_voltage
    update_interval: 10s
    accuracy_decimals: 4
    filters:
      - sliding_window_moving_average:
          window_size: 10
  - platform: template
    name: "pH Value"
    id: ph_value
    unit_of_measurement: "pH"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(ph_voltage).state == 0) return {};
      float v7 = 1.5;
      float v4 = 2;
      float slope = (7.0 - 4.0) / (v7 - v4);
      float ph = 7.0 + slope * (id(ph_voltage).state - v7);
      if (ph < 0.0 || ph > 14.0) return {};
      return ph;
  # ---------- EC SENSOR (TDS x1.969 correction applied) ----------
  - platform: ads1115
    multiplexer: 'A3_GND'
    gain: 4.096
    name: "EC Voltage"
    id: ec_voltage
    update_interval: 10s
    accuracy_decimals: 4
  - platform: template
    name: "TDS Value"
    id: tds_value
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(ec_voltage).state == 0) return {};
      float voltage = id(ec_voltage).state;
      float temperature = 25.0;
      float compensationCoefficient = 1.0 + 0.02 * (temperature - 25.0);
      float compensationVoltage = voltage / compensationCoefficient;
      float tds = (133.42 * compensationVoltage * compensationVoltage * compensationVoltage
                   - 255.86 * compensationVoltage * compensationVoltage
                   + 857.39 * compensationVoltage) * 0.5;
      tds *= 0.4374;
      if (tds < 0.0) return 0.0;
      return tds;
  - platform: template
    name: "EC Value"
    id: ec_value
    unit_of_measurement: "mS/cm"
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(tds_value).state == 0) return {};
      float ec = id(tds_value).state * 2.0 / 1000.0;
      return ec;
  # ---------- ULTRASONIC WATER LEVEL ----------
  - platform: ultrasonic
    trigger_pin: GPIO17
    echo_pin: GPIO4
    name: "Tank Distance"
    id: tank_distance
    update_interval: 30s
    pulse_time: 20us
    timeout: 2m
    accuracy_decimals: 2
    unit_of_measurement: "m"
  - platform: template
    name: "Tank Water Level"
    id: tank_level
    unit_of_measurement: "cm"
    accuracy_decimals: 1
    update_interval: 30s
    lambda: |-
      if (isnan(id(tank_distance).state)) return {};
      float tank_height = 50.0;
      float distance = id(tank_distance).state * 100.0;
      float level = tank_height - distance;
      if (level < 0) return 0.0;
      if (level > tank_height) return tank_height;
      return level;
  - platform: template
    name: "Tank Percentage"
    id: tank_percent
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      if (isnan(id(tank_distance).state)) return {};
      float tank_height = 50.0;
      float distance = id(tank_distance).state * 100.0;
      float level = tank_height - distance;
      if (level < 0) return 0.0;
      if (level > tank_height) return 100.0;
      return (level / tank_height) * 100.0;
  # ---------- BOARD HEALTH ----------
  - platform: internal_temperature
    name: "ESP32 Temperature"
    update_interval: 60s
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
binary_sensor:
  - platform: status
    name: "Controller Status"

switch:
  - platform: gpio
    pin: GPIO12
    name: "Pump 3"
    id: pump_3
    inverted: false
